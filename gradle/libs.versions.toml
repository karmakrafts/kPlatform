[versions]

java = "17"

androidGradle = "9.4.1" # https://developer.android.com/reference/tools/gradle-api
kplatform = "1.3.0"
kotlin = "2.5.0-Beta2" # https://github.com/JetBrains/kotlin/releases
kotlinBrowser = "2026.10.1" # https://github.com/JetBrains/kotlin-wrappers/releases
dokka = "2.3.0-Beta" # https://github.com/Kotlin/dokka/releases
karmaConventions = "1.23.0.315-SNAPSHOT" # https://github.com/karmakrafts/karma-conventions/tags
oshi = "7.7.2" # https://github.com/oshi/oshi/releases

[libraries]

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-wrappers-browser = { module = "org.jetbrains.kotlin-wrappers:kotlin-browser", version.ref = "kotlinBrowser" }
oshi-core = { module = "com.github.oshi:oshi-core", version.ref = "oshi" }

[plugins]

android-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidGradle" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
karmaConventions = { id = "dev.karmakrafts.conventions.karma-conventions", version.ref = "karmaConventions" }